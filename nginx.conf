server {
    listen 80;

    server_name _;

    # #. نام app با DNS داخلی داکر هر ۱۰ ثانیه دوباره resolve می‌شود (proxy_pass با متغیر)
    # proxy_pass ثابت (http://app:3000) آدرس IP را فقط در شروع nginx می‌گرفت ؛ هر بار کانتینر app از نو ساخته می‌شد
    # و IP تازه می‌گرفت ، nginx هنوز به IP قدیمی می‌فرستاد ⇒ 502 تا docker restart nginx (2026-10-29 ، docs/deployment.md)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fundynode_upstream http://app:3000;

    location / {
        proxy_pass $fundynode_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
