# تنظیمات دپلوی (tools/deploy/deploy.sh ⇐ deploy.bat) — بدون هیچ رمز یا کلیدی ؛ کلید SSH فقط روی کامپیوتر توسعه است
DEPLOY_HOST=5.75.192.70
DEPLOY_SSH_PORT=22
DEPLOY_USER=root
# پوشه docker-compose.prod.yml روی سرور ؛ خالی ⇒ از کانتینر در حال اجرای fundynode پیدا می‌شود (برچسب working_dir کامپوز)
DEPLOY_DIR=
# کلید اختصاصی دپلوی ؛ همان کلید FundyPanel (یک کلید برای هر کامپیوتر توسعه) ، با «deploy.bat setup» روی این سرور هم نصب می‌شود
DEPLOY_KEY="$HOME/.ssh/fundy_deploy_ed25519"
# رجیستری محلی روی Docker Desktop (کانتینر fundy-registry ، مشترک با FundyPanel) ؛ همین پورت روی 127.0.0.1 سرور با تونل معکوس SSH باز می‌شود
REGISTRY_PORT=5055
# چند نسخه آخر در رجیستری محلی نگه داشته شود (نسخه‌های قابل برگشت روی خود سرور نگه داشته می‌شوند: FUNDY_KEEP_VERSIONS در fundy-server.sh)
LOCAL_KEEP=3
