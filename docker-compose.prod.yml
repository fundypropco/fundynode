services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: fundynode
    restart: always
    environment:
      - APP_PORT=3000
      - NODE_ENV=production
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@my-mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BALE_NOTIF_BOT_CHANNEL_ID=${BALE_NOTIF_BOT_CHANNEL_ID}
      - BALE_NOTIF_BOT_TOKEN=${BALE_NOTIF_BOT_TOKEN}
    volumes:
      - app-logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pm2-runtime ecosystem.config.cjs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthcheck',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: fundyworker
    restart: always
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@my-mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BALE_NOTIF_BOT_CHANNEL_ID=${BALE_NOTIF_BOT_CHANNEL_ID}
      - BALE_NOTIF_BOT_TOKEN=${BALE_NOTIF_BOT_TOKEN}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pm2-runtime worker.ecosystem.config.cjs
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  mongo:
    image: mongo:8
    container_name: my-mongo
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    volumes:
      - mongo-data:/data/db
      - ./mongo-bkp:/backup
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u $MONGO_INITDB_ROOT_USERNAME -p $MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:8
    container_name: my-redis
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - default


volumes:
  mongo-data:
  redis-data:
  app-logs:

networks:
  default:
    driver: bridge